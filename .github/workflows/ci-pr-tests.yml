name: CI - PR Tests

on: 
  pull_request:
    paths:
        - 'packages/**'

jobs:
  release:
    name: PR tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Tools & Dependencies
        uses: withstudiocms/automations/.github/actions/install@main

      - name: Run Build
        run: pnpm build
  
      - name: Run Tests
        run: pnpm test
        