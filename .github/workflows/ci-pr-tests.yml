name: CI - PR Tests

on: 
  pull_request:
    paths:
        - 'packages/**'

jobs:
  release:
    name: PR tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Install Tools & Dependencies
        uses: withstudiocms/automations/.github/actions/install@main

      - name: Run Build
        run: pnpm build
  
      - name: Run Tests
        run: pnpm test
        